name: Build grammar artifacts

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the source-lock version after every target passes
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: grammars-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python scripts/grammars.py verify
      - run: python -m unittest discover -s tests -v
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path producer/Cargo.toml --check
      - name: Verify version and tag agree
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c 'import json,os; assert os.environ["RELEASE_TAG"] == "v" + json.load(open("grammars.lock.json"))["version"]'

  build:
    needs: verify
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    name: Static library / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: x86_64-pc-windows-msvc, runner: windows-2025, run: true}
          - {target: aarch64-pc-windows-msvc, runner: windows-2025, run: false}
          - {target: x86_64-apple-darwin, runner: macos-15-intel, run: true}
          - {target: aarch64-apple-darwin, runner: macos-15, run: true}
          - {target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04, run: true}
          - {target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm, run: true}
          - {target: x86_64-unknown-linux-musl, runner: ubuntu-22.04, run: true}
          - {target: aarch64-unknown-linux-musl, runner: ubuntu-22.04-arm, run: true}
    env:
      TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install target
        run: rustup target add ${{ matrix.target }}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.target == 'aarch64-pc-windows-msvc' && 'amd64_arm64' || 'amd64' }}
      - name: Install musl compiler
        if: endsWith(matrix.target, '-musl')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          echo 'CC=musl-gcc' >> "$GITHUB_ENV"
          echo 'RUSTFLAGS=-C linker=musl-gcc -C target-feature=+crt-static' >> "$GITHUB_ENV"
      - name: Build archive
        run: python scripts/grammars.py build --target ${{ matrix.target }}
      - name: Parse with every grammar on the target host
        if: matrix.run
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Validate cross-target link
        if: ${{ !matrix.run }}
        run: cargo test --locked --target ${{ matrix.target }} --no-run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grammars-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  wasm:
    needs: verify
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install checksum-pinned WASI SDK
        shell: bash
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/wasi-sdk.tar.gz" https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-x86_64-linux.tar.gz
          echo "87d1d1a2879d139cdc624b968efad3d4a97b8078cdff95e63ac88ecafd1a0171  $RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
      - run: python scripts/grammars.py wasm --sdk ${{ runner.temp }}/wasi-sdk-29.0-x86_64-linux
      - run: npm ci --ignore-scripts
      - run: node scripts/check-wasm.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grammars-wasm
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build, wasm]
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: grammars-*
          path: dist
          merge-multiple: true
      - run: python scripts/grammars.py aggregate dist
      - name: Publish validated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG=$(python -c 'import json; print("v" + json.load(open("grammars.lock.json"))["version"])')
          gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" --title "Ash grammars $RELEASE_TAG" --generate-notes
